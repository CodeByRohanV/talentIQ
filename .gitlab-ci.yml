stages:
  - deploy

deploy:
  stage: deploy
  tags:
    - docker
  only:
    - main
  script:
    - git config --global --add safe.directory /home/ubuntu/skillz
    - rsync -av --delete $CI_PROJECT_DIR/ /home/ubuntu/skillz/
    - cd /home/ubuntu/skillz
    - docker-compose down
    - docker system prune -af
    - docker-compose up -d --build
    - docker image prune -f
    - docker ps