version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: xeskillz-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    env_file:
      - ./server/.env
    volumes:
      - uploads_data:/app/uploads
    networks:
      - xeskillz-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/}
    container_name: xeskillz-frontend
    restart: always
    networks:
      - xeskillz-network

networks:
  xeskillz-network:
    driver: bridge

volumes:
  uploads_data:
